name: Brain parity
on:
  push:
    branches: [macos-apple-silicon-port]
  pull_request:
    paths:
      - scripts/cf_analysis.py
      - scripts/brain-parity-check.py
      - tests/fixtures/brain-parity-apple-silicon.json
      - .github/workflows/brain-parity.yml
  workflow_dispatch:
jobs:
  mac-brain:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Download pinned Mac FFmpeg and FFprobe
        run: |
          cd "$RUNNER_TEMP"
          npm pack --ignore-scripts @dfloresc/ffmpeg-macos-gpl-arm64@9.0.1-1
          mkdir ffmpeg-mac
          tar -xzf dfloresc-ffmpeg-macos-gpl-arm64-9.0.1-1.tgz -C ffmpeg-mac
          "$RUNNER_TEMP/ffmpeg-mac/package/bin/ffmpeg" -version | head -1
          "$RUNNER_TEMP/ffmpeg-mac/package/bin/ffprobe" -version | head -1
      - name: Record Mac brain measurements
        run: python scripts/brain-parity-check.py --ffmpeg "$RUNNER_TEMP/ffmpeg-mac/package/bin/ffmpeg" --output "$RUNNER_TEMP/mac-reference.json"
      - name: Record Mac scalar measurements
        run: python scripts/brain-parity-check.py --scalar --ffmpeg "$RUNNER_TEMP/ffmpeg-mac/package/bin/ffmpeg" --output "$RUNNER_TEMP/mac-scalar.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-brain-reference
          path: |
            ${{ runner.temp }}/mac-reference.json
            ${{ runner.temp }}/mac-scalar.json
  windows-brain:
    needs: mac-brain
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: mac-brain-reference
          path: ${{ runner.temp }}/mac-brain
      - name: Download the pinned Windows FFmpeg runtime
        shell: pwsh
        run: |
          $url = 'https://github.com/hxxliz/vapormint/releases/download/v2.0.0/ffmpeg-n9.0.1-29-gad500d59cb-20260913-win64-mirror.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
      - name: Compare Windows brain measurements with Mac
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) { throw 'Pinned FFmpeg not found' }
          & $ffmpeg -version | Select-Object -First 1
          Write-Host 'Default Windows vs default Mac:'
          python scripts/brain-parity-check.py --ffmpeg "$ffmpeg" --expected "$env:RUNNER_TEMP/mac-brain/mac-reference.json"
          $defaultResult = $LASTEXITCODE
          Write-Host 'Default Windows vs scalar Mac:'
          python scripts/brain-parity-check.py --ffmpeg "$ffmpeg" --expected "$env:RUNNER_TEMP/mac-brain/mac-scalar.json"
          Write-Host 'Scalar Windows vs scalar Mac:'
          python scripts/brain-parity-check.py --scalar --ffmpeg "$ffmpeg" --expected "$env:RUNNER_TEMP/mac-brain/mac-scalar.json"
          $scalarResult = $LASTEXITCODE
          if ($defaultResult -ne 0 -or $scalarResult -ne 0) { exit 1 }
